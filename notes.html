  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
    }

    /* ---------- TOP NAV ---------- */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      gap: 28px;
    }

    .nav-inner a {
      color: #d0d0d0;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-inner a:hover {
      color: #ffffff;
    }

    /* ---------- PAGE ---------- */

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .content-inner {
      width: 100%;
      max-width: 800px;
    }

    .content-inner h2 {
      font-family: "Playfair Display", serif;
      font-size: 44px;
      margin: 0 0 60px;
      font-weight: 600;
    }

    /* ---------- NOTE ---------- */

    .note {
      margin-bottom: 70px;
    }

    .note-date {
      font-size: 14px;
      color: #888;
      margin-bottom: 6px;
    }

    .note h3 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 500;
      color: #ffffff;
    }

    .note p {
      margin: 0;
      font-size: 17px;
      color: #b5b5b5;
      max-width: 760px;
      line-height: 1.8;
    }

    /* ---------- FOOTER ---------- */

    footer {
      max-width: 1200px;
      margin: 120px auto 0;
      padding: 0 24px 40px;
      font-size: 13px;
      color: #777;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 900px) {
      .content-inner h2 {
        font-size: 38px;
      }
    }

  </style>
</head>

  <!-- ===== TOP NAV ===== -->
