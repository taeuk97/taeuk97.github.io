<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>{{ page.title }} | Taeuk Im</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap"
        rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.8;
    }

    /* ---------- TOP NAV ---------- */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      gap: 28px;
    }

    .nav-inner a {
      color: #d0d0d0;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-inner a:hover {
      color: #ffffff;
    }

    /* ---------- PAGE ---------- */

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .content-inner {
      width: 100%;
      max-width: 800px;
    }

    .note-date {
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 44px;
      font-weight: 600;
      margin: 0 0 40px;
    }

    h2 {
      margin-top: 45px;
      font-size: 26px;
    }

    h3 {
      margin-top: 35px;
    }

    p,
    li {
      font-size: 17px;
      color: #b5b5b5;
    }

    a {
      color: #ffffff;
    }

    img {
      max-width: 100%;
      height: auto;
      margin: 30px 0;
    }

    pre {
      background: #171717;
      padding: 20px;
      border-radius: 6px;
      overflow-x: auto;
    }

    code {
      font-family: monospace;
    }

    /* ---------- FOOTER ---------- */

    footer {
      max-width: 1200px;
      margin: 120px auto 0;
      padding: 0 24px 40px;
      font-size: 13px;
      color: #777;
    }

  </style>
</head>

<body>

  <!-- ===== TOP NAV ===== -->

  <nav class="navbar">
    <div class="nav-inner">

      <a href="/index.html">Home</a>
      <a href="/publications.html">Publications</a>
      <a href="/projects.html">Projects</a>
      <a href="/research-log.html">Research Log</a>
      <a href="/notes.html">Notes</a>
      <a href="/experience.html">Experience</a>
      <a href="/honors.html">Honors & Awards</a>
      <a href="/contact.html">Contact</a>

    </div>
  </nav>


  <!-- ===== MAIN ===== -->

  <main class="page">

    <div class="content-inner">

      <div class="note-date">
        {{ page.date | date: "%B %-d, %Y" }}
      </div>

      {{ content }}

    </div>

  </main>


  <!-- ===== FOOTER ===== -->

  <footer>
    © 2026 Taeuk Im · Aerospace Communications & Applied Intelligence (ACAI) Lab @ KAIST
  </footer>

</body>

</html>
